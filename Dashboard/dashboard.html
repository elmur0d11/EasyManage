<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyManage Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

<header>
    <h2>EasyManage</h2>

    <div class="header-actions">
        <button id="accountBtn" class="account-btn">
            👤 Account
        </button>
        <button id="logoutBtn">Logout</button>
    </div>
</header>

<main>

    <div class="top-bar">
    <h1>My Rooms</h1>
    
    <div class="top-bar-buttons">
        <button id="createRoomBtn">
            Create Room
        </button>
        <button id="updateRoomBtn">
            Update Room
        </button>
        <button id="deleteRoomBtn">
            Delete Room
        </button>
        <button id="joinRoomBtn">
            Join Room
        </button>
    </div>
</div>

    <div id="roomsContainer" class="rooms-grid">

       
    </div>

</main>

<script src="dashboard.js"></script>

</body>
</html>
