<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | EasyManage</title>
    <link rel="stylesheet" href="changePassword.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <span>🔒</span>
                <h1>EasyManage</h1>
            </div>
            <div class="nav-actions">
                <a href="accountCenter.html" class="back-btn">
                    ← Back to Account Center
                </a>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="password-form-card">
            <div class="form-header">
                <div class="icon-wrapper">🔐</div>
                <h2>Change Password</h2>
                <p class="subtitle">Update your account password</p>
            </div>
            
            <form id="changePasswordForm">
                <div class="input-group">
                    <label for="oldPassword">Current Password</label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="oldPassword" 
                            placeholder="Enter current password"
                            required
                        >
                        <button type="button" class="toggle-password" data-target="oldPassword">
                            👁️
                        </button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="newPassword">New Password</label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="newPassword" 
                            placeholder="Enter new password"
                            required
                        >
                        <button type="button" class="toggle-password" data-target="newPassword">
                            👁️
                        </button>
                    </div>
                    <div class="password-strength" id="passwordStrength"></div>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            placeholder="Confirm new password"
                            required
                        >
                        <button type="button" class="toggle-password" data-target="confirmPassword">
                            👁️
                        </button>
                    </div>
                    <div class="password-match" id="passwordMatch"></div>
                </div>
                
                <button type="submit" class="submit-btn" id="submitBtn">
                    🔐 Change Password
                </button>
            </form>
            
            <div id="message" class="message-alert" style="display: none;"></div>
        </div>
    </div>

    <script src="changePassword.js"></script>
</body>
</html>
