<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Center | EasyManage</title>
    <link rel="stylesheet" href="accountCenter.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <span>👤</span>
                <h1>EasyManage</h1>
            </div>
            <div class="nav-actions">
                <a href="../Dashboard/dashboard.html" class="back-btn">
                    ← Back to Dashboard
                </a>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="account-center">
            
            <div class="account-card">
                <div class="card-header">
                    <div class="card-icon">👤</div>
                    <h2>Account Center</h2>
                    <p>Manage your account settings</p>
                </div>
                
                <div class="button-group">
                    <button class="account-action-btn update-profile-btn" id="updateProfileBtn">
                        <span class="btn-icon">📝</span>
                        <span class="btn-text">Update Profile</span>
                        <span class="btn-arrow">→</span>
                    </button>
                    
                    <button class="account-action-btn change-password-btn" id="changePasswordBtn">
                        <span class="btn-icon">🔒</span>
                        <span class="btn-text">Change Password</span>
                        <span class="btn-arrow">→</span>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script src="accountCenter.js"></script>
</body>
</html>
