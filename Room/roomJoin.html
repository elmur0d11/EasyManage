<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Room | EasyManage</title>

    <link rel="stylesheet" href="roomJoin.css">
</head>
<body>

    <nav class="navbar">

        <div class="left">
            <button onclick="goDashboard()">Dashboard</button>
        </div>

        <div class="logo">
            EasyManage
        </div>

        <div class="right"></div>

    </nav>

    <main class="container">

        <div class="card">

            <h2>Join Room</h2>

            <p>Enter the room code below.</p>

            <input
                type="text"
                id="roomCode"
                placeholder="Room Code">

            <button id="joinBtn">
                Join Room
            </button>

            <p id="message"></p>

        </div>

    </main>

    <script src="roomJoin.js"></script>

</body>
</html>
