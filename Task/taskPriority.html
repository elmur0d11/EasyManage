<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Task Priority</title>
    <link rel="stylesheet" href="taskPriority.css">
</head>
<body>

<div class="container">

    <h1>EasyManage</h1>

    <div class="card">

        <h2>Update Task Priority</h2>

        <input
            type="text"
            id="roomCode"
            placeholder="Room Code">

        <input
            type="text"
            id="taskTitle"
            placeholder="Task Title">

        <select id="priority">
            <option value="">Select Priority</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
            <option value="Critical">Critical</option>
        </select>

        <button onclick="updatePriority()">
            Update Priority
        </button>

        <p id="message"></p>

    </div>

</div>

<script src="taskPriority.js"></script>

</body>
</html>
